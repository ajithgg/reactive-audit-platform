server:
  port: 8082

spring:
  application:
    name: user-platform
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/user_platform
    username: audit
    password: audit
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info

auditor:
  enabled: true
  endpoint: http://localhost:8083
  service-name: user-platform
  environment: local
  fail-on-error: false
  retry-attempts: 2
  redacted-fields:
    - password
    - accessToken
    - refreshToken
    - authorization
    - secret
